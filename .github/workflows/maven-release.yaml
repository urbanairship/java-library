name: Perform Maven Release (Standalone)

on:
  push:
    branches:
      - "INFRA-8096"
  #workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '11' #(8, 11, 17, 21)

jobs:
  maven-release:
    name: Maven Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Set up JDK & GPG / Sonatype Settings
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: ${{ secrets.SONATYPE_USERNAME }}
          server-password: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Import GPG Private Key
        run: |
            echo "$RAW_GPG_KEY" | gpg --batch --import
        env:
          RAW_GPG_KEY: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}

      - name: Run Maven Release
        run: |
          mvn -B -ntp \
            -Darguments="-Dmaven.javadoc.skip=true -DskipTests=true -Dgpg.keyname=B85D4DAEA102C95F" \
            -Dresume=false \
            -DscmCommentPrefix="[github] [skip ci] " \
            -DtagNameFormat=@{project.version} \
            -DpushChanges=false \
            -DlocalCheckout=true \
            release:prepare release:perform
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_GPG_PASSPHRASE }}

#      - name: Push Changes & Tags
#        if: success()
#        run: |
#          git push origin master
#          git push origin --tags