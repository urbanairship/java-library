name: Perform Maven Release (Standalone) - preflight check

on:
  push:
    branches:
      - "INFRA-8096"
  #workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '11' #(8, 11, 17, 21)

jobs:
  maven-release:
    name: Maven Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Set up JDK & GPG / Sonatype Settings
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: ${{ secrets.SONATYPE_USERNAME }}
          server-password: ${{ secrets.SONATYPE_PASSWORD }}
          gpg-private-key: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.SONATYPE_GPG_PASSPHRASE }}

      - name: Check 1 Verify Sonatype Credentials (API Ping)
        run: |
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -u "${{ secrets.SONATYPE_USERNAME }}:${{ secrets.SONATYPE_PASSWORD }}" \
              https://central.sonatype.com/api/v1/publisher/deployments)
              
            echo "Sonatype API responded with HTTP Status: $HTTP_STATUS"
              
            if [ "$HTTP_STATUS" -eq 401 ]; then
              echo "ERROR: Sonatype Username or Token Password from LastPass is INVALID (401 Unauthorized)."
              exit 1
            else
              echo "SUCCESS: Sonatype authentication is working fine!"
            fi

      - name: Check 2 Verify GPG Key & Passphrase (Local Signing)
        run: |
            mvn clean verify -B -ntp \
              -DskipTests=true \
              -Dmaven.javadoc.skip=true \
              -Dgpg.passphrase="${{ secrets.SONATYPE_GPG_PASSPHRASE }}"

