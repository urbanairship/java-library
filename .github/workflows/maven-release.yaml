name: Maven Release Dry-Run (INFRA-8096-AI)

on:
  push:
    branches:
      - "INFRA-8096-AI"
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '11'

jobs:
  maven-release-dryrun:
    name: Maven Release Dry-Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      # server-username / server-password must be ENV VAR NAMES, not the secret
      # values directly. setup-java writes ${env.SONATYPE_USERNAME} into settings.xml;
      # the env vars must be present when Maven runs (see each mvn step below).
      - name: Set up JDK & Maven Settings (Sonatype Central)
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD

      # ── GPG ─────────────────────────────────────────────────────────────────

      - name: Import GPG Key
        run: |
          # Write to file — avoids env-var encoding edge cases with binary content
          printf '%s' "$RAW_GPG_KEY" > /tmp/gpg_import.asc
          gpg --batch --import /tmp/gpg_import.asc
          rm /tmp/gpg_import.asc

          # Configure gpg-agent BEFORE listing keys.
          # On ubuntu-24.04 runners (GnuPG 2.4), allow-loopback-pinentry is
          # required for headless batch signing; without it gpg-agent refuses
          # passphrase-via-stdin and the key appears invisible.
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\n' >> ~/.gnupg/gpg-agent.conf
          printf 'pinentry-mode loopback\nno-tty\n' >> ~/.gnupg/gpg.conf

          # Reload agent to pick up new config
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent || true

          # Set ultimate trust via ownertrust (more reliable than interactive edit)
          FINGERPRINT=$(gpg --list-keys --with-colons 2>/dev/null \
            | awk -F: '/^fpr:/{print $10; exit}')
          if [ -z "$FINGERPRINT" ]; then
            echo "ERROR: key import failed — no public key found in keyring"
            exit 1
          fi
          echo "${FINGERPRINT}:6:" | gpg --batch --import-ownertrust
          echo "GPG_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"

          echo "=== Secret keys after import ==="
          gpg --list-secret-keys --keyid-format LONG
        env:
          RAW_GPG_KEY: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}

      - name: Verify GPG Signing (standalone)
        # Sanity-check: sign a file + verify before handing the key to Maven.
        # pinentry-mode loopback is now in gpg.conf so no need to pass it here.
        run: |
          echo "test payload" > /tmp/sign_test.txt
          gpg --batch --yes \
              --passphrase "$MAVEN_GPG_PASSPHRASE" \
              -a --sign /tmp/sign_test.txt
          gpg --batch --verify /tmp/sign_test.txt.asc /tmp/sign_test.txt
          rm /tmp/sign_test.txt /tmp/sign_test.txt.asc
          echo "GPG sign+verify OK"
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_GPG_PASSPHRASE }}

      # ── Sonatype connectivity ────────────────────────────────────────────────

      - name: Check Sonatype Central Credentials (read-only API call)
        # Bearer token = base64(username:password) — same encoding the
        # central-publishing-maven-plugin uses internally.
        # The /publisher/deployments endpoint returns 200 (even empty list)
        # for valid creds and 401 for bad creds. Zero upload, zero side-effect.
        run: |
          TOKEN=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" \
            | base64 -w 0)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://central.sonatype.com/api/v1/publisher/deployments/published?maxPageSize=1")
          echo "Sonatype API response: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Sonatype credentials valid."
          else
            echo "ERROR: unexpected HTTP $HTTP_CODE — check SONATYPE_USERNAME / SONATYPE_PASSWORD secrets."
            exit 1
          fi
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      # ── Release dry-run ──────────────────────────────────────────────────────

      # DRY-RUN ONLY — release:prepare -DdryRun=true:
      #   • runs preparationGoals (clean verify) → GPG signs real artifacts
      #   • simulates version bump and SCM tag, writes .backup files
      #   • does NOT commit, does NOT tag, does NOT deploy anything
      # release:perform is intentionally absent — it would invoke
      # central-publishing-maven-plugin which uploads a bundle to Sonatype
      # staging even with autoPublish=false.
      - name: Maven Release Prepare (DRY RUN — no commit, no deploy)
        run: |
          mvn -B -ntp \
            -Dresume=false \
            -DdryRun=true \
            -DscmCommentPrefix="[github] [skip ci] " \
            -DtagNameFormat=@{project.version} \
            -DpushChanges=false \
            -DlocalCheckout=true \
            -Dlocal.gpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
            -Darguments="-Dmaven.javadoc.skip=true -DskipTests=true -Dgpg.passphrase=${MAVEN_GPG_PASSPHRASE}" \
            release:prepare
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_GPG_PASSPHRASE }}

      - name: Clean Up Dry-Run Backup Files
        if: always()
        run: mvn release:clean -B -ntp
