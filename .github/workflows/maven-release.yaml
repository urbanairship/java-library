name: Perform Maven Release (Standalone)

on:
  push:
    branches:
      - "INFRA-8096"
  #workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '11' #(8, 11, 17, 21)

jobs:
  maven-release:
    name: Maven Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Set up JDK & GPG / Sonatype Settings
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: ${{ secrets.SONATYPE_USERNAME }}
          server-password: ${{ secrets.SONATYPE_PASSWORD }}
          gpg-private-key: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.SONATYPE_GPG_PASSPHRASE }}

      - name: Run Maven Verification (With Native Signing)
        run: |
            mvn clean verify -B -ntp \
              -DskipTests=true \
              -Dmaven.javadoc.skip=true \
              -Dgpg.keyname="95BCB1665C76C3A6"
        env:
            GPG_PASSPHRASE: ${{ secrets.SONATYPE_GPG_PASSPHRASE }}

