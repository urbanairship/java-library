name: Sonatype Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '11'
  MAVEN_VERSION: '3.9.9'

jobs:
  release:
    name: Release to Maven Central
    runs-on: [self-hosted, ubuntu]

    steps:
      - name: Ensure release runs on master only
        run: |
          if [ "${{ github.ref_name }}" != "master" ]; then
            echo "ERROR: releases must be triggered from master (current: ${{ github.ref_name }})"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.JAVA_BUILD_GH_TOKEN }}

      - name: Configure git user
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Install Maven
        run: |
          mkdir -p $HOME/maven
          wget --tries=3 --waitretry=5 --retry-connrefused \
            https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz
          tar -xzf apache-maven-${MAVEN_VERSION}-bin.tar.gz -C $HOME/maven --strip-components=1
          echo "$HOME/maven/bin" >> $GITHUB_PATH

      - name: Configure Maven settings for Sonatype Central
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${env.SONATYPE_USERNAME}</username>
                <password>${env.SONATYPE_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Import GPG private key
        run: echo "$GPG_KEY" | gpg --batch --import
        env:
          GPG_KEY: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}

      - name: Run Maven Release
        run: |
          mvn -B -ntp \
            -Dlocal.gpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
            -Dresume=false \
            -DscmCommentPrefix="[github] [skip ci] " \
            -DtagNameFormat=@{project.version} \
            -DpushChanges=false \
            -DlocalCheckout=true \
            -Darguments="-Dmaven.javadoc.skip=true" \
            release:prepare release:perform
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_GPG_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Push to java-library-dev
        run: |
          git push origin master
          git push origin --tags

      - name: Generate GitHub App token for public repo sync
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: urbanairship
          repositories: java-library

      - name: Sync to java-library (public)
        run: |
          while IFS= read -r key; do
            git config --local --unset "$key" 2>/dev/null || true
          done < <(git config --local --list --name-only | grep -i '^includeif')
          git remote add public "https://x-access-token:${GH_TOKEN}@github.com/urbanairship/java-library.git"
          git push public master
          git push public --tags
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Summary
        if: always()
        run: |
          RELEASE_VERSION=$(git tag --sort=-creatordate | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "## Sonatype Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${RELEASE_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | \`com.urbanairship:java-client:${RELEASE_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next step" >> $GITHUB_STEP_SUMMARY
          echo "Approve and publish the staging bundle on [Sonatype Central Portal](https://central.sonatype.com/publishing)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Public repo synced" >> $GITHUB_STEP_SUMMARY
          echo "- [urbanairship/java-library](https://github.com/urbanairship/java-library) — master + tag \`${RELEASE_VERSION}\`" >> $GITHUB_STEP_SUMMARY
